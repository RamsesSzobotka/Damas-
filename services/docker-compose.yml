version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: damas-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: damas
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - damas-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: damas-backend
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_ENV: development
      MONGODB_URI: mongodb://admin:password@mongodb:27017/damas?authSource=admin
      MONGODB_NAME: damas
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      IA_SERVICE_URL: http://ia:3002
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - damas-network
    volumes:
      - ./backend/src:/app/src
    command: bun run dev

  # IA Service
  ia:
    build:
      context: ./ia
      dockerfile: Dockerfile
    container_name: damas-ia
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      NODE_ENV: development
      LOG_LEVEL: info
      MAX_SEARCH_DEPTH: 7
      CACHE_SIZE: 1000
    networks:
      - damas-network
    volumes:
      - ./ia/src:/app/src
    command: bun run dev

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: damas-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://backend:3001
      VITE_IA_URL: http://ia:3002
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
      VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
    depends_on:
      - backend
      - ia
    networks:
      - damas-network
    volumes:
      - ./frontend/src:/app/src
    command: bun run dev

  # Nginx (Reverse Proxy - Opcional)
  nginx:
    image: nginx:alpine
    container_name: damas-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
      - ia
    networks:
      - damas-network
    profiles:
      - nginx

networks:
  damas-network:
    driver: bridge

volumes:
  mongodb_data:
  mongodb_config:
